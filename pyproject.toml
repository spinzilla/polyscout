[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polyscout"
version = "0.1.0"
description = "Multi-platform research with auditable, graded evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1"]

[project.scripts]
polyscout = "polyscout.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
tmp_path_retention_count = 100000
tmp_path_retention_policy = "all"
